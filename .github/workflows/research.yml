# Investigacion (solo a mano): momentum de resultados (fechas del SEC), la replica del sweep y la caja 09:00-10:30.
# Imprime solo tablas agregadas (conteos y promedios). No toca ninguna cuenta ni coloca ordenes.

name: Investigacion (resultados)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Cuantas acciones de la watchlist de ejemplo (vacio = todas)"
        required: false
        default: ""
      study:
        description: "Estudio a correr"
        type: choice
        options: ["resultados", "sweep", "caja", "validar-caja", "optimizar-caja", "filtros-caja"]
        default: "resultados"
      sweep_args:
        description: "Opciones del estudio sweep (por ejemplo: --target 2 --shorts --interval 1h)"
        required: false
        default: "--interval 30m --range 5y --target 1.5"
      caja_args:
        description: "Opciones del estudio caja 09:00-10:30 (por ejemplo: --symbols QQQ,SPY,IWM,DIA --box 09:00-09:30, o --days 730 --cost-pct 0.05)"
        required: false
        default: "--symbols QQQ,SPY --days 1827 --cost-pct 0.01"
      robustness:
        description: "Pruebas de robustez (walk-forward, sensibilidad, bootstrap) en vez de la cartera"
        type: boolean
        default: false
      trial_var:
        description: "Varianza del Sharpe diario entre las variantes probadas (Deflated Sharpe)"
        required: false
        default: "7.93e-05"

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Estudio de momentum de resultados (SEC 8-K 2.02 + precios diarios desde 2005)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          LIMIT: ${{ inputs.limit }}
          TRIAL_VAR: ${{ inputs.trial_var }}
          STUDY: ${{ inputs.study }}
          SWEEP_ARGS: ${{ inputs.sweep_args }}
          CAJA_ARGS: ${{ inputs.caja_args }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ROBUSTNESS: ${{ inputs.robustness }}
        run: |
          ARGS="--symbols trader-scanner/watchlist.example.txt"
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          if [ -n "$TRIAL_VAR" ]; then ARGS="$ARGS --trial-var $TRIAL_VAR"; fi
          if [ "$ROBUSTNESS" = "true" ]; then ARGS="$ARGS --robustness --no-portfolio"; fi
          if [ "$STUDY" = "sweep" ]; then
            if [ -n "$LIMIT" ]; then SWEEP_ARGS="$SWEEP_ARGS --limit $LIMIT"; fi
            case "$SWEEP_ARGS" in *--debug*) export ALPACA_DEBUG=1 ;; esac
            python3 trader-analyst/sweep_study.py $SWEEP_ARGS
            exit $?
          fi
          if [ "$STUDY" = "filtros-caja" ]; then
            python3 trader-analyst/orb_filters.py $CAJA_ARGS
            exit $?
          fi
          if [ "$STUDY" = "optimizar-caja" ]; then
            python3 trader-analyst/orb_optimize.py $CAJA_ARGS
            exit $?
          fi
          if [ "$STUDY" = "validar-caja" ]; then
            python3 trader-analyst/orb_validate.py $CAJA_ARGS
            exit $?
          fi
          if [ "$STUDY" = "caja" ]; then
            if [ -n "$LIMIT" ]; then CAJA_ARGS="$CAJA_ARGS --limit $LIMIT"; fi
            python3 trader-analyst/orb_study.py $CAJA_ARGS
            exit $?
          fi
          python3 trader-analyst/drift_study.py $ARGS
