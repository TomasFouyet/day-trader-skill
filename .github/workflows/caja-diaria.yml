# Caja 09:00-10:00 en la cuenta PAPER de Alpaca (simulada: sin dinero real). Una pasada cada 5 minutos.
#
# Cada pasada (trader-alerts/orb_paper.py run) arma la caja de 09:00 a 10:00 de Nueva York en QQQ, SPY, DIA e
# IWM, entra con la primera vela de 5 minutos que cierra fuera (hasta las 13:00), pone el stop en el otro borde
# y una orden OCO para el 70% a 1,7R, y cuando ese 70% se cobra pasa el stop del 30% restante a la entrada.
# Solo coloca ordenes con la Variable PAPER_TRADING=true, y solo en paper-api.alpaca.markets.
#
# Disparo: cron-job.org cada 5 minutos de 09:55 a 16:05 de Nueva York, lunes a viernes (README, seccion 13),
# porque el cron de GitHub se atrasa. El horario de abajo es solo un respaldo: si dos pasadas coinciden,
# las ordenes llevan un id por dia y Alpaca no acepta la misma dos veces.
#
# Vigia: una pasada que empieza entre 09:50 y 12:50 se queda despierta hasta las 13:05 y revisa a los ~6
# segundos de cada cierre de vela de 5 minutos, para entrar casi al precio de cierre de la vela de ruptura
# (con pasadas sueltas entraba 1-2 minutos tarde). Mientras tanto las pasadas programadas esperan en fila.

name: Caja diaria (paper)

on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo mostrar lo que haria, sin ordenes"
        type: boolean
        default: false
      report:
        description: "Mandar el resumen de las operaciones abiertas a Telegram"
        type: boolean
        default: false
      audit:
        description: "Auditar las entradas de hoy contra la regla (demora, desvio en R, objetivo); no opera"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: orb-paper
  cancel-in-progress: false

jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 200      # the watcher (10:00-13:05 New York) stays up; a normal pass takes seconds
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restaurar estado (cache privado)
        uses: actions/cache/restore@v4
        with:
          path: trader/state
          key: orb-state-${{ github.run_id }}
          restore-keys: orb-state-

      - name: Una pasada (solo cuenta paper, nada real)
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          PAPER_TRADING: ${{ vars.PAPER_TRADING || secrets.PAPER_TRADING }}
          ORB_RISK_PCT: ${{ vars.ORB_RISK_PCT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          REPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.report }}
          AUDIT: ${{ github.event_name == 'workflow_dispatch' && inputs.audit }}
        run: |
          mkdir -p trader/state
          if [ "$AUDIT" = "true" ]; then
            python3 trader-alerts/orb_paper.py audit
            exit $?
          fi
          if [ "$REPORT" = "true" ]; then
            python3 trader-alerts/orb_paper.py report --telegram
            exit $?
          fi
          ARGS="--telegram"
          if [ "$DRY_RUN" = "true" ]; then ARGS="--dry-run"; fi
          # inside the entry window the pass stays up as a watcher: one pass a few seconds after each 5 minute
          # bar closes, until 13:05 (the scheduled passes wait in line meanwhile)
          NOW=$(TZ=America/New_York date +%H%M)
          if (( 10#$NOW >= 950 && 10#$NOW < 1250 )); then ARGS="$ARGS --watch-until 13:05"; fi
          python3 trader-alerts/orb_paper.py run $ARGS

      - name: Guardar estado (cache privado)
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: trader/state
          key: orb-state-${{ github.run_id }}
